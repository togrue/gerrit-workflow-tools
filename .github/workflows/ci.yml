name: CI

# Every pull request and every push to dev runs what AGENTS.md "Build and check" asks for:
# ruff, mypy, the unit tests on Linux and Windows, the extension's tests and its e2e run.
# The integration tests against a real Gerrit in Docker run nightly and on demand.

on:
  pull_request:
  push:
    branches: [dev]
  schedule:
    # Nightly at 03:00 UTC: the integration tests, and the e2e run against the newest VS Code.
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ruff and mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - name: ruff format
        run: uv run ruff format --check .
      - name: ruff check
        run: uv run ruff check .
      - name: mypy src
        run: uv run mypy src
      - name: mypy tests
        run: uv run mypy tests

  unit:
    name: pytest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run pytest -q

  extension:
    name: VS Code extension tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: vscode/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test

  e2e:
    name: VS Code e2e
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: vscode/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Get VS Code
        run: npm run e2e -- --get-vscode
      # No display on the runner: run.ts starts VS Code headless. The pictures of every step are
      # uploaded, so a change to the views can be reviewed by looking at them.
      - name: e2e
        env:
          GER_E2E_PNG: ${{ runner.temp }}/e2e-pictures
        run: npm run e2e
      - name: Upload the e2e pictures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-pictures
          path: ${{ runner.temp }}/e2e-pictures
          if-no-files-found: ignore
          retention-days: 14

  integration:
    name: Integration tests (Gerrit in Docker)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --group integration
      - run: uv run --group integration pytest tests/integration -q
