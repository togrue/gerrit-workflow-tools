[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gerrit-workflow-tools"
version = "0.1.0"
description = "Local git helpers for Gerrit stacked workflows"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "prompt-toolkit>=3.0",
    "requests>=2.28",
]

[dependency-groups]
dev = [
    "mypy>=1.8",
    "pre-commit>=3.0",
    "pylint>=4.0.5",
    "pytest>=7.0",
    "ruff>=0.9",
]

# Real Gerrit (Docker); use: uv sync --group integration && uv run --group integration pytest tests/integration
integration = [
    "docker[ssh]>=7.0",
    "pytest>=7.0",
    "requests>=2.28",
]

[tool.uv]
default-groups = ["dev"]

[project.scripts]
ger = "gerrit_workflow_tools.cli_ger:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gerrit_workflow_tools"]
force-include = { "contrib/completion/ger.bash" = "gerrit_workflow_tools/completion/ger.bash" }

[tool.hatch.build.targets.sdist]
include = ["src/gerrit_workflow_tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
# Integration tests (Docker + Gerrit) live under tests/integration; run explicitly (see tests/integration/README.md).
addopts = "--ignore=tests/integration"
markers = [
    "integration: needs Docker + Gerrit (tests/integration)",
    "slow: intentionally slow unit fixtures",
]

[tool.ruff]
target-version = "py310"
line-length = 120
src = ["src", "tests"]

[tool.mypy]
python_version = "3.10"
explicit_package_bases = true
mypy_path = "src"
packages = ["gerrit_workflow_tools"]

[[tool.mypy.overrides]]
module = "prompt_toolkit.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "prompt_toolkit"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "requests.*"
ignore_missing_imports = true

[tool.pylint."MAIN"]
ignore-paths = [
    "^tests/.*$",
]
source-roots = ["src"]
py-version = "3.10"

[tool.pylint."FORMAT"]
max-line-length = 120

[tool.pylint."MESSAGES CONTROL"]
disable = [
]

[tool.vulture]
paths = ["src", "tests"]
ignore_names = [
    # Prompt-toolkit Lexer / Validator / Completer callbacks.
    "lex_document",
    "validate",
    "get_completions",
    # Prompt-toolkit key bindings registered via decorator.
    "_history_up",
    "_history_down",
    # sqlite3.Connection attribute assignment.
    "row_factory",
    # pytest hooks / autouse fixtures / marks (plugin entry points).
    "pytest_configure",
    "pytest_fixture_setup",
    "pytest_sessionfinish",
    "_isolate_xdg_cache_home",
    "_clear_git_cache",
    "_profile_test_duration",
    "_reset_hyperlink_mode",
    "pytestmark",
    # pytest fixtures consumed via parameter name injection.
    "history_home",
    # unittest.mock attribute assignments.
    "return_value",
    "side_effect",
    # CLI entry points / string-dispatched mains.
    "main_reword",
    "render_bash_completion_script",
    # Settings constructed from plain maps in tests.
    "from_map",
    # Used by unit tests; keep as public test helper API.
    "clear_git_cache",
]

[tool.ruff.lint]
# Ruff defaults are only a subset of pycodestyle (E4, E7, E9) plus Pyflakes (F).
# These families add import order, bug-prone patterns, modern syntax, and cleanup.
extend-select = [
    "E501", # line-length
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "I",   # isort
    "PIE", # flake8-pie
    "RUF", # Ruff-specific
    "SIM", # flake8-simplify
    "UP",  # pyupgrade
]
