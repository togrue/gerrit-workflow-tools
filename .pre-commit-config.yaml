# The full test suite runs in CI on every pull request (.github/workflows/ci.yml) and by hand
# before one (see AGENTS.md). The guardrail tests below are fast (no git, no network) and run
# on every commit.
repos:
  - repo: local
    hooks:
      - id: guardrails
        name: architecture and doc guardrails
        entry: uv run pytest -q -n 0 -p no:cacheprovider tests/test_architecture.py tests/test_docs.py tests/test_parity.py
        language: system
        pass_filenames: false
        always_run: true
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.10
    hooks:
      - id: ruff-format
        args: []
      - id: ruff-check
        args: [--fix]
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.20.1
    hooks:
      - id: mypy
        args: [--config-file=pyproject.toml]
        # Match `uv run mypy` (packages in pyproject); tests use pytest without stubs here.
        files: ^src/
